# ============================================================================
# WasteFlow — Build immagini + Deploy (Gitea Actions, runner self-hosted)
# ----------------------------------------------------------------------------
# - push su `develop`/`master`: builda e pusha backend+frontend sul Gitea CR.
# - push su `master`: dopo la build, deploya in PRODUZIONE su Contabo
#   (/opt/rifiuti/, frontend su 127.0.0.1:3017, nginx di sistema fa TLS).
#
# Adattamenti Gitea (vedi note infra): provenance:false, cache su registry
# (no type=gha), login al Gitea CR con secret CR_TOKEN. Niente chaining
# workflow_run: build e deploy sono job dello stesso workflow legati da needs.
# ============================================================================

name: Deploy

on:
  push:
    branches: [develop, master]
    # Un commit di sola documentazione non cambia cio' che gira in produzione:
    # ricostruire le immagini e sostituire i container per aggiornare COSTS.md
    # occupa il runner per mezz'ora e ripaga nulla.
    #
    # Il filtro vale solo per i commit che toccano ESCLUSIVAMENTE questi
    # percorsi: se un commit mescola codice e documentazione, il rilascio parte
    # normalmente. Verificato prima di introdurlo che nessun .md sia importato
    # dal codice, incluso negli asset di build, e che nessun test legga da
    # `docs/` (i file letti dalle suite sono `monitoring/alerts/*.yml` e
    # `tools/rentri-fake/`, che restano fuori dal filtro).
    #
    # `tools/agente-pesa/**` e' l'agente Go che gira sul PC della pesa, non nel
    # VPS: un commit che tocca solo quello non cambia nulla in produzione. La
    # suite backend legge `tools/agente-pesa/testdata/contratto/` (payload-lettura.spec.ts),
    # ma un commit che cambia SOLO il contratto non cambia cio' che gira: il
    # contratto resta verificato dal job `agente-pesa` e dal job `backend` di
    # ci.yml, che non ignora `tools/`.
    #
    # Per rilasciare comunque dopo un commit filtrato: `workflow_dispatch`.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'tools/agente-pesa/**'
  # Avvio manuale: permette di ri-rilasciare (o ritentare un gate caduto per
  # ragioni transitorie) senza dover creare un commit fittizio su master.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: gitea.tail8be933.ts.net/graziano
  BACKEND_IMAGE: gitea.tail8be933.ts.net/graziano/rifiuti-backend
  FRONTEND_IMAGE: gitea.tail8be933.ts.net/graziano/rifiuti-frontend

jobs:
  # ==========================================================================
  # QUALITY GATE — lint + test + build (blocca il deploy se fallisce)
  # ==========================================================================
  quality:
    name: Quality gate (lint, test, build)
    runs-on: ubuntu-latest
    # Timeout di sicurezza: nessun deploy può restare appeso a tempo indefinito.
    timeout-minutes: 20
    env:
      NODE_VERSION: "20"
    # Redis reale per le suite dell'oracolo che provano il limitatore preventivo
    # e la resilienza con guasti iniettati (R5): usano ioredis contro un'istanza
    # vera, non un finto. Senza Redis fallivano con "MaxRetriesPerRequestError"
    # e il gate bloccava ogni rilascio pur essendo verde in locale, dove un
    # Redis di sviluppo è sempre acceso.
    #
    # NIENTE `services:` e niente 6379 fissa: il runner gira con
    # `container.network=host` (ops/setup-gitea-runner.sh) e con la rete host
    # Docker IGNORA i port mapping, quindi un service starebbe sempre sulla
    # 6379 e colliderebbe con gli altri job in parallelo (E2E di ci.yml incluso).
    # Il Redis si avvia con `docker run` su una porta host scelta dal kernel
    # (scripts/ci/redis-job.sh), che finisce in REDIS_CI_PORT: da li' i test
    # leggono RENTRI_RATELIMIT_TEST_REDIS_PORT.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # Installa dipendenze del monorepo (root + workspaces).
      - name: Install dipendenze (monorepo)
        run: npm ci

      # Prisma client necessario prima di lint/test/build.
      - name: Prisma generate
        working-directory: apps/backend
        run: npm run prisma:generate

      # Lint backend — solo errori bloccano (--max-warnings=-1): i warning
      # esistenti (no-explicit-any) sono attesi. Eseguito DENTRO apps/backend
      # così `parserOptions.project` (type-aware) risolve src+test senza
      # "Parsing error" (che si verifica solo eseguendo eslint dalla root).
      - name: Lint backend
        working-directory: apps/backend
        run: npx eslint "{src,test}/**/*.ts" --max-warnings=-1

      # Lint frontend — idem, dalla dir del workspace.
      - name: Lint frontend
        working-directory: apps/frontend
        run: npx eslint "src/**/*.ts" --max-warnings=-1

      # Test unitari backend CON coverage: lo script npm "test:cov" incorpora
      # `--forceExit` (chiude il processo anche se un client Redis/Bull/Prisma
      # lascia un handle aperto), `--runInBand` (niente worker orfani) e `--ci`
      # (nessun comportamento interattivo). Un `testTimeout` (jest.config.js,
      # 30s) fa FALLIRE — non appendere — un test bloccato in attesa di infra.
      # Con `timeout-minutes: 20` sul job, un eventuale hang è comunque coperto.
      #
      # STESSO comando di ci.yml (npm run test:cov): un solo segnale di
      # coverage, verificato in ENTRAMBI i gate, niente piu' divergenza tra
      # "cosa dice ci.yml" e "cosa blocca davvero il rilascio". La soglia in
      # jest.config.js e' stata allineata alla coverage reale (P5 task 3): un
      # test rosso O sotto soglia blocca il deploy. Verificato che termina da
      # solo (exit 0) anche simulando l'assenza di Redis/DB. Vedi memory
      # rifiuti-build-deploy-gotchas.
      - name: Test unitari backend (Jest + coverage)
        working-directory: apps/backend
        # Env fittizie richieste alla COSTRUZIONE di alcuni moduli in test (es.
        # JwtStrategy esige un secret): valori DUMMY solo per CI, mai in prod.
        # I test sono unit (mock), non serve infra reale (Redis/DB assenti = ok).
        env:
          NODE_ENV: test
          JWT_SECRET: ci-dummy-jwt-secret-not-used-in-prod
        run: npm run test:cov

      # Script di backup/restore: una libreria rotta blocca il rilascio.
      - name: Test script di backup (bash)
        working-directory: ${{ github.workspace }}
        run: bash ops/test/backup-verifica.test.sh

      # Test di CONFORMITA' contro la fake API RENTRI (tools/rentri-fake).
      # Sono l'unica prova che il client parli davvero il protocollo dell'ente
      # (auth ID_AUTH_REST_02, ciclo 202/200/303, 403 non ritentato): senza
      # questo passo resterebbero scritti e mai eseguiti.
      # `tools/*` NON e' un workspace npm, quindi `npm ci` alla radice non
      # installa le dipendenze della fake: vanno installate qui, altrimenti le
      # suite non partono affatto ("Test suite failed to run").
      - name: Install dipendenze fake RENTRI (oracolo di conformita')
        working-directory: tools/rentri-fake
        run: npm ci

      # Se Redis non parte o non risponde, lo script lo dice QUI con un
      # messaggio comprensibile: altrimenti l'unico sintomo e' un
      # "MaxRetriesPerRequestError" sepolto dentro l'output di Jest, che non
      # somiglia affatto a "manca un servizio".
      - name: Avvia Redis di test (porta assegnata dal kernel)
        run: bash scripts/ci/redis-job.sh avvia

      - name: Test di conformita' RENTRI contro l'oracolo
        working-directory: apps/backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-dummy-jwt-secret-not-used-in-prod
          # Il Redis del job sta sulla porta scritta in REDIS_CI_PORT dallo
          # step precedente (via $GITHUB_ENV), non sulla 16399 che i test
          # assumono quando si lavora in locale.
          RENTRI_RATELIMIT_TEST_REDIS_HOST: 127.0.0.1
        run: |
          export RENTRI_RATELIMIT_TEST_REDIS_PORT="${REDIS_CI_PORT:?REDIS_CI_PORT non impostata}"
          npm run test:oracolo

      # Build backend (stesso percorso usato dal Dockerfile.prod).
      - name: Build backend (nest build)
        working-directory: apps/backend
        run: npm run build

      # ------------------------------------------------------------------
      # FRONTEND — promosso nel gate bloccante (era assente: un frontend
      # rotto poteva raggiungere la produzione senza che nulla lo impedisse).
      # Stessi step di ci.yml: se hanno valore per la CI, lo hanno anche qui.
      # ------------------------------------------------------------------
      # TEST FRONTEND: DELIBERATAMENTE FUORI DAL GATE BLOCCANTE (2026-07-25).
      #
      # Richiedono un browser (Karma + ChromeHeadless). Il runner self-hosted
      # non ha alcun Chrome nell'immagine (`catthehacker/ubuntu:act-latest`) e
      # l'azione di terze parti `browser-actions/setup-chrome` non funziona su
      # Gitea Actions: e' questa la ragione per cui `ci.yml` risultava rosso da
      # mesi e veniva ignorato per abitudine. Promuovere quel passo nel gate
      # bloccante ha solo spostato il guasto, impedendo tre rilasci di fila.
      #
      # Si applica il criterio di P5: un allarme che suona sempre non e' un
      # allarme. Il gate verifica cio' che sa verificare davvero — lint e build
      # del frontend, che NON richiedono browser e intercettano errori reali.
      #
      # I 20 test frontend restano eseguibili in locale
      # (`cd apps/frontend && npx ng test --watch=false --browsers=ChromeHeadless`)
      # e sono verdi. Per riportarli nel gate serve un browser nell'immagine
      # del runner: vedi il follow-up in docs/OPERATIONS_RUNBOOK.md.

      - name: Build frontend (ng build)
        working-directory: apps/frontend
        run: npm run build

      # Cleanup garantito del Redis di test, anche se un passo precedente e'
      # fallito. Gli orfani sfuggiti (runner morto a meta') li toglie la
      # pulizia del runner, via label neat.ci.job, dopo 3 ore.
      - name: Rimuovi il Redis di test (sempre)
        if: always()
        run: bash scripts/ci/redis-job.sh ferma

  # ==========================================================================
  # BUILD & PUSH immagini sul Gitea Container Registry
  # ==========================================================================
  build:
    name: Build & push immagini
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag immagine (sha breve)
        id: meta
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Gitea Container Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.tail8be933.ts.net
          username: Graziano
          password: ${{ secrets.CR_TOKEN }}

      # Build & push con RETRY: il push sul Gitea CR (via Funnel) fallisce a
      # intermittenza ("failed to push ... unknown"). Riproviamo fino a 3 volte;
      # la cache di layer rende i retry rapidi. context backend = ./apps/backend,
      # frontend = root del monorepo (il frontend non ha lockfile proprio).
      - name: Build & push BACKEND (retry)
        run: |
          n=0
          until [ $n -ge 3 ]; do
            docker buildx build --provenance=false \
              -t "${BACKEND_IMAGE}:latest" \
              -t "${BACKEND_IMAGE}:${{ steps.meta.outputs.tag }}" \
              -f ./apps/backend/Dockerfile.prod --push ./apps/backend && exit 0
            n=$((n+1)); echo "::warning::push BACKEND fallito (tentativo $n), riprovo tra 10s"; sleep 10
          done
          echo "::error::push BACKEND fallito dopo 3 tentativi"; exit 1

      - name: Build & push FRONTEND (retry)
        run: |
          n=0
          until [ $n -ge 3 ]; do
            docker buildx build --provenance=false \
              -t "${FRONTEND_IMAGE}:latest" \
              -t "${FRONTEND_IMAGE}:${{ steps.meta.outputs.tag }}" \
              -f ./apps/frontend/Dockerfile.prod --push . && exit 0
            n=$((n+1)); echo "::warning::push FRONTEND fallito (tentativo $n), riprovo tra 10s"; sleep 10
          done
          echo "::error::push FRONTEND fallito dopo 3 tentativi"; exit 1

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

  # ==========================================================================
  # DEPLOY in produzione (solo master) su Contabo
  # ==========================================================================
  deploy:
    name: Deploy produzione (Contabo)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_TAG,CR_TOKEN
          script_stop: true
          command_timeout: 25m
          script: |
            set -e
            export DEPLOY_TAG="${{ needs.build.outputs.tag }}"
            cd /opt/rifiuti/site
            git fetch --all --prune
            git checkout master
            git reset --hard origin/master
            echo "$CR_TOKEN" | docker login gitea.tail8be933.ts.net -u Graziano --password-stdin
            export TAG="$DEPLOY_TAG"
            COMPOSE="docker compose -p rifiuti --env-file /opt/rifiuti/.env -f docker-compose.prod.yml"
            # Solo le nostre immagini: un pull di postgres/redis con il tag mobile
            # (16-alpine, 7-alpine) faceva ricreare il database a ogni deploy in cui
            # il tag era cambiato. Quelle immagini si aggiornano con un intervento
            # deciso, backup prima; `up -d` le scarica da solo solo se mancano.
            $COMPOSE pull backend frontend
            # Backup verificato prima delle migration (forward-only): se fallisce,
            # set -e ferma tutto e la produzione resta sulla versione precedente.
            BACKUP_MODALITA=predeploy WASTEFLOW_COMPOSE_FILE="$PWD/docker-compose.prod.yml" bash ops/backup-offsite.sh
            # Migrazioni Prisma (forward-only) prima di avviare la nuova versione,
            # SEMPRE come owner (DATABASE_URL_MIGRAZIONI): l'URL dell'applicazione
            # puo' puntare a un ruolo senza diritti DDL. Le virgolette singole
            # fanno espandere la variabile dentro il container, non qui. `run`
            # avvia da solo postgres (depends_on con healthcheck) se non gira.
            $COMPOSE run --rm backend sh -c 'DATABASE_URL="$DATABASE_URL_MIGRAZIONI" npx prisma migrate deploy'
            # Ruoli DB (wasteflow_app / wasteflow_sistema), DOPO le migrazioni: lo
            # script SQL esige _prisma_migrations. db-ruoli.sh legge le password dal
            # .env SENZA eseguirlo ne' stamparle e le passa a psql sullo stdin: non
            # compaiono in alcun argv ne' nel log. Senza password nel .env stampa
            # "ruoli DB non configurati: salto" e prosegue; con una sola (o uno user
            # sbagliato) si ferma con errore PRIMA di `up -d`, a produzione intatta.
            RUOLI_ENV_FILE=/opt/rifiuti/.env PG_EXEC="$COMPOSE exec -T postgres" bash ops/db-ruoli.sh
            $COMPOSE up -d
            # Smoke test: risponde il database (503 se e' giu', quindi -f fallisce)
            # e risponde il frontend. 30 tentativi a 3 secondi.
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3017/api/v1/health/db >/dev/null && curl -fsS http://127.0.0.1:3017/ >/dev/null; then
                echo "Deploy OK (tag $DEPLOY_TAG)"
                exit 0
              fi
              sleep 3
            done
            echo "Smoke test fallito dopo 30 tentativi"
            $COMPOSE ps
            $COMPOSE logs --since 5m backend
            exit 1
        env:
          DEPLOY_TAG: ${{ needs.build.outputs.tag }}
          CR_TOKEN: ${{ secrets.CR_TOKEN }}

      - name: Smoke test pubblico (se PRODUCTION_URL impostata)
        if: vars.PRODUCTION_URL != ''
        run: curl -fsS "${{ vars.PRODUCTION_URL }}" >/dev/null && echo "URL pubblico OK"

  # ==========================================================================
  # ESITO RILASCIO — gira SEMPRE (anche se quality/build/deploy falliscono),
  # dichiara esplicitamente se il deploy in produzione e' avvenuto.
  #
  # Perche' serve: su push a master, se il gate "quality" fallisce (es. un
  # errore Prettier), "build" e "deploy" risultano "skipped" per effetto della
  # catena needs — non "failure". Un job skipped non somiglia a un fallimento:
  # il 25/07/2026 e' passato inosservato ("il push e' andato a buon fine")
  # mentre la produzione restava indietro. Questo job rende l'esito
  # inequivocabile: fallisce (rosso, visibile) ogni volta che un push su
  # master non si traduce in un deploy riuscito.
  # ==========================================================================
  release-status:
    name: Esito rilascio
    runs-on: ubuntu-latest
    needs: [quality, build, deploy]
    if: always()
    steps:
      - name: Dichiara se il deploy e' avvenuto
        run: |
          echo "Ref:            ${{ github.ref }}"
          echo "Quality gate:   ${{ needs.quality.result }}"
          echo "Build & push:   ${{ needs.build.result }}"
          echo "Deploy prod.:   ${{ needs.deploy.result }}"

          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "::notice::Ramo diverso da master: nessun deploy in produzione atteso per questo push (deploy 'skipped' e' normale qui)."
            exit 0
          fi

          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "::notice::DEPLOY IN PRODUZIONE AVVENUTO CON SUCCESSO."
            exit 0
          fi

          echo "::error::DEPLOY IN PRODUZIONE NON AVVENUTO (quality=${{ needs.quality.result }}, build=${{ needs.build.result }}, deploy=${{ needs.deploy.result }}). La produzione NON e' stata aggiornata da questo push su master."
          exit 1

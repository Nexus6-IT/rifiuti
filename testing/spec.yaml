# Generato da testing-umano init 0.2.0 il 2026-10-13 sul database wasteflow_prod.
# Controlli universali: isolamento dei tenant, riferimenti senza FK, numerazioni senza buchi.
# Nascono tutti in-attesa: il primo giro li conta senza bloccare nulla. Promuovili ad attiva
# uno alla volta, dopo aver guardato le violazioni ('testing-umano baseline crea <CODICE>').

versione: 1
sorgente:
  url_env: RIFIUTI_TESTING_PG_URL
  marcatore: staging
  host_ammessi:
    - 127.0.0.1
    - ::1
    - localhost
  database_vietati: []
  statement_timeout_ms: 5000
  durata_max_s: 120
  tenant:
    tabella: tenants
    id: id
    colonna: tenant_id
    tipo: uuid
invarianti:
  - codice: STESSO_TENANT_ACTIVITY_LOGS_FIR_ID
    categoria: isolamento
    stato: in-attesa
    descrizione: Ogni riga di activity_logs punta, con fir_id, a una riga di firs dello stesso tenant
    nota: "init: vincolo activity_logs_fir_id_fkey"
    chiave: &a1
      - id
    sql: |
      SELECT c.id, c.tenant_id::text AS tenant_figlio, p.tenant_id::text AS tenant_padre
        FROM activity_logs c
        JOIN firs p ON p.id = c.fir_id
       WHERE (c.tenant_id = ANY($tenant) OR p.tenant_id = ANY($tenant))
         AND p.tenant_id IS DISTINCT FROM c.tenant_id
  - codice: STESSO_TENANT_ACTIVITY_LOGS_USER_ID
    categoria: isolamento
    stato: in-attesa
    descrizione: Ogni riga di activity_logs punta, con user_id, a una riga di users dello stesso tenant

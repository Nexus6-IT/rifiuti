          type: integer
          format: int32
      - name: progressivo_finale
        in: query
        description: Progressivo finale fino al quale restituire l'elenco dei numeri FIR.
        schema:
          type: integer
          format: int32
      - name: Paging-Page
        in: header
        description: Valore per l'header Paging-Page.
        schema:
          maximum: 2147483647
          minimum: 1
          type: integer
          format: int32
          default: 1
      - name: Paging-PageSize
        in: header
        description: Valore per l'header Paging-PageSize.
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 100
      responses:
        200:
          description: OK
          headers:
            Paging-PageCount:
              description: Numero totale di pagine.
              schema:
                type: integer
                description: Numero totale di pagine.
                format: $int32
            Paging-Page:
              description: Numero di pagina.
              schema:
                type: integer
                description: Numero di pagina.
                format: $int32
            Paging-PageSize:
              description: Dimensione della pagina.
              schema:
                type: integer
                description: Dimensione della pagina.
                format: $int32
            Paging-TotalRecordCount:
              description: Numero totale di record.
              schema:
                type: integer
                description: Numero totale di record.
                format: $int32
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EfirModel'
        400:
          description: La richiesta non è valida. La proprietà `model_state` contiene un dizionario in cui ogni chiave identifica il dato per il quale è stato rilevato un errore e il relativo valore contiene un array con i codici degli errori riscontrati.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        403:
          description: Operazione non consentita.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        404:
          description: La risorsa richiesta non è stata trovata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        500:
          description: Errore non gestito (contattare l'assistenza).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        503:
          description: Servizio temporaneamente non disponibile. La risposta può essere restituita anche durante i periodi di chiusura programmata dei servizi, in questo caso nella proprietà `model_state` verrà riportato il codice di errore `sys.maintenance`.

        Le condizioni affinché l'annullamento del numero FIR venga eseguito sono:

        <ul><li>Non deve risultare presente tra quelli in compilazione nei servizi di supporto</li><li>Non deve risultare presente tra le copie cartacee dei FIR riconsegnate dal trasportatore</li><li>Non deve risultare presente tra le copie digitali dei FIR riconsegnate dal destinatario</li><li>Non deve risultare alcuna trasmissione dati FIR effettuata da alcun soggetto (per rifiuti pericolosi)</li></ul>
      parameters:
      - name: codice_blocco
        in: path
        description: Codice del blocco a cui appartiene il FIR per cui si richiede l'annullamento.
        required: true
        schema:
          type: string
      - name: progressivo
        in: path
        description: Numero progressivo del FIR per cui si richiede l'annullamento.
        required: true
        schema:
          type: string
      responses:

  - codice: NUMERAZIONE_RENTRI_NUMERI_VIDIMATI_PROGRESSIVO
    categoria: numerazione
    stato: in-attesa
    descrizione: rentri_numeri_vidimati.progressivo numera da 1 senza buchi per tenant, codice_blocco
    nota: "init: vincolo univoco (tenant_id, codice_blocco, progressivo)"
    chiave:
      - tenant
      - codice_blocco
    scostamento:
      a: ultimo
      b: righe
    sql: |
      SELECT c.tenant_id::text AS tenant, c.codice_blocco, count(c.progressivo)::bigint AS righe, max(c.progressivo)::bigint AS ultimo
        FROM rentri_numeri_vidimati c
       WHERE c.tenant_id = ANY($tenant)
       GROUP BY c.tenant_id, c.codice_blocco
      HAVING max(c.progressivo) <> count(c.progressivo)
  - codice: NUMERAZIONE_WASTE_MOVEMENTS_PROGRESSIVE_NUMBER
    categoria: numerazione
    stato: in-attesa
    descrizione: waste_movements.progressive_number numera da 1 senza buchi per tenant, progressive_year
    nota: "init: vincolo univoco (tenant_id, progressive_year, progressive_number)"
    chiave:
      - tenant
      - progressive_year
    scostamento:
      a: ultimo
      b: righe
    sql: |
      SELECT c.tenant_id::text AS tenant, c.progressive_year, count(c.progressive_number)::bigint AS righe, max(c.progressive_number)::bigint AS ultimo
        FROM waste_movements c
       WHERE c.tenant_id = ANY($tenant)
       GROUP BY c.tenant_id, c.progressive_year
      HAVING max(c.progressive_number) <> count(c.progressive_number)

# nginx del container frontend: serve la SPA Angular e inoltra le chiamate API
# al backend NestJS (servizio "backend" sulla rete compose interna, porta 3000).
# L'HTTPS e il dominio pubblico sono gestiti dall'nginx di sistema sul VPS.

# Nasconde versione/nome del server nell'header Response e nelle pagine di
# errore di default (riduce fingerprinting).
server_tokens off;

# Header di sicurezza per i documenti HTML/asset statici serviti da questo
# container (la SPA Angular). Allineati per contenuto a quelli che Helmet
# applica lato API (vedi apps/backend/src/main.ts) — qui la CSP è adattata
# a ciò che la SPA usa davvero: font Google (index.html), fetch/XHR e
# WebSocket verso l'API stessa origine, nessuno script/stile esterno oltre
# ai font. Non replicati sulla location /api/: le risposte JSON del backend
# portano già i propri header Helmet, evitare header duplicati/in conflitto.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressione asset statici
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → backend NestJS (prefix globale /api/v1 incluso lato app)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (Socket.IO notifiche real-time)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Temi PrimeNG chiaro/scuro e lo script che sceglie quale caricare: hanno
    # nomi fissi, senza hash (vedi "inject": false in angular.json e
    # src/index.html), quindi NON possono avere la cache immutabile qui sotto,
    # altrimenti dopo un aggiornamento di PrimeNG il browser terrebbe il vecchio
    # tema per un anno. "no-cache" = rivalida a ogni caricamento (304 se uguale).
    # Deve stare prima della location generica: nginx usa la prima regex che combacia.
    location ~ ^/(tema-primeng-(chiaro|scuro)\.css|assets/tema-iniziale\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Cache lunga sugli asset con hash nel nome
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # Fallback SPA: ogni rotta non-file ritorna index.html
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://error.ignicraft.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.html;
    }
}

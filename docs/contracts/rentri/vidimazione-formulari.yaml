          description: >-
            Sono state eseguite troppe richieste non valide.
                                Questa risposta viene restituita quando viene rilevato un numero eccessivo di richieste concorrenti, autenticate ma non valide.
                                In questo caso, le eventuali richieste valide continueranno ad essere accettate, mentre solo le richieste non valide verranno bloccate applicando un meccanismo di `ban` a livello di chiamante (`issuer`) e nella proprietà `model_state` verrà riportato il codice di errore `sys.issuerIsBanned`.

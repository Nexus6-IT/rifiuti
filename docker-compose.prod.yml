# ============================================================================
# WasteFlow — stack di PRODUZIONE (Contabo, /opt/rifiuti/)
# ----------------------------------------------------------------------------
# Immagini buildate dalla CI Gitea e pushate sul registry Gitea CR. Qui si fa
# solo `pull` + `up`. L'HTTPS e il dominio pubblico (rifiuti.ignicraft.com) sono
# gestiti dall'nginx DI SISTEMA del VPS: il frontend espone solo 127.0.0.1:3017.
#
# SSO: l'app usa la propria auth JWT; l'integrazione come client OIDC del realm
# condiviso `ignicraft` (auth.ignicraft.com) e' un follow-up — qui NON si avvia
# un Keycloak proprio. Idem monitoring: si aggancia l'osservabilita' condivisa
# (/opt/observability/) tramite la rete esterna `monitoring`, niente
# Prometheus/Grafana propri.
#
# Lanciare SEMPRE con nome progetto esplicito per evitare collisioni con altri
# stack che vivono in sottocartella `site/`:
#   docker compose -p rifiuti --env-file /opt/rifiuti/.env \
#     -f docker-compose.prod.yml <cmd>
# ============================================================================

# Rotazione dei log json-file, comune a tutti i servizi. Senza max-size i log
# crescono senza limite (plausible e cadvisor sugli altri stack erano arrivati a
# 5-6 GB). Mai logrotate/copytruncate dall'esterno: blocca `docker logs --tail`.
# Il primo `up -d` dopo questa modifica ricrea anche postgres e redis.
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    logging: *logging
    environment:
      POSTGRES_DB: ${DB_NAME:-wasteflow_prod}
      POSTGRES_USER: ${DB_USER:-wasteflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD richiesta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wasteflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wasteflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    logging: *logging
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD richiesta}
    volumes:
      - redis_data:/data
    networks:
      - wasteflow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ${REGISTRY:-gitea.tail8be933.ts.net/graziano}/rifiuti-backend:${TAG:-latest}
    restart: always
    logging: *logging
    labels:
      # Guardia, non informazione: vedi la regola "password sistema senza user app".
      guardia-ruoli: "${DB_SISTEMA_PASSWORD:+${DB_APP_USER:?DB_SISTEMA_PASSWORD senza DB_APP_USER - ruoli DB incompleti}}"
    # Ogni variabile letta dal codice deve stare qui o in NON_PASSATE di
    # infrastruttura-prod.guard.spec.ts (apps/backend/src/core/config).
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Ruoli DB (RLS pezzo 1). L'applicazione si collega col ruolo `wasteflow_app`
      # (NOBYPASSRLS) quando DB_APP_PASSWORD e' valorizzata; senza, resta
      # sull'owner come prima. Le password nei URL vanno senza caratteri
      # riservati (openssl rand -hex 32; db-ruoli.sh accetta solo A-Za-z0-9 _ . -, minimo 16).
      #
      # CONFIGURAZIONE A META' = errore di compose, a ogni comando e quindi al
      # `pull`, PRIMA di backup e migration (e non un backend che cade dopo).
      # DB_APP_USER (wasteflow_app), DB_APP_PASSWORD e DB_SISTEMA_PASSWORD vanno
      # impostate tutte e tre o per niente. Le quattro regole stanno cosi':
      #   - password app senza user app  -> qui sotto, parte username;
      #   - user app senza password app  -> qui sotto, parte password;
      #   - user app senza password sistema -> DATABASE_URL_SISTEMA;
      #   - password sistema senza user app -> label guardia-ruoli del servizio.
      # Pool: nessun connection_limit nell'URL = default di Prisma (num_cpus * 2 + 1). Con una
      # transazione per operazione (RLS pezzo 2a) la concorrenza tiene le connessioni piu' a lungo:
      # se compaiono timeout sul pool sotto carico, aggiungere ?connection_limit=N all'URL.
      DATABASE_URL: postgresql://${DB_APP_USER:-${DB_APP_PASSWORD:+${DB_APP_USER:?DB_APP_PASSWORD senza DB_APP_USER (wasteflow_app) - ruoli DB incompleti}}${DB_USER:-wasteflow}}:${DB_APP_PASSWORD:-${DB_APP_USER:+${DB_APP_PASSWORD:?DB_APP_USER senza DB_APP_PASSWORD - ruoli DB incompleti}}${DB_PASSWORD}}@postgres:5432/${DB_NAME:-wasteflow_prod}
      # Client di sistema (job, BYPASSRLS). Vuota senza ruoli: PrismaSistemaService
      # ripiega allora su DATABASE_URL.
      DATABASE_URL_SISTEMA: ${DB_APP_USER:+postgresql://${DB_SISTEMA_USER:-wasteflow_sistema}:${DB_SISTEMA_PASSWORD:?DB_APP_USER senza DB_SISTEMA_PASSWORD - ruoli DB incompleti}@postgres:5432/${DB_NAME:-wasteflow_prod}}
      # Migration: SEMPRE owner (serve DDL). Non la legge il codice: la usa
      # `prisma migrate deploy` di deploy.yml e ops/restore.sh.
      DATABASE_URL_MIGRAZIONI: postgresql://${DB_USER:-wasteflow}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-wasteflow_prod}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-wasteflow_prod}
      DB_USER: ${DB_USER:-wasteflow}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # I cache service (RoleCache/PermissionCache) leggono REDIS_CLUSTER_NODES,
      # non REDIS_HOST: va puntato al servizio redis anche in standalone.
      REDIS_CLUSTER_NODES: ${REDIS_CLUSTER_NODES:-redis:6379}
      # CORS: il callback SAML e' un POST cross-origin da Keycloak
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://rifiuti.ignicraft.com,https://auth.ignicraft.com}
      # Base URL della SPA per il redirect post-login dal callback SAML
      FRONTEND_URL: ${FRONTEND_URL:-https://rifiuti.ignicraft.com}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET richiesta}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET richiesta}
      # Cifratura a riposo dei certificati RENTRI per-tenant
      RENTRI_CREDENTIAL_ENC_KEY: ${RENTRI_CREDENTIAL_ENC_KEY:?RENTRI_CREDENTIAL_ENC_KEY richiesta}
      # Firma: scelta ESPLICITA obbligatoria (fail-closed, P3 task 1). In
      # produzione non esiste un default: senza queste il backend rifiuta di
      # avviarsi invece di ripiegare in silenzio su una chiave effimera senza
      # certificato. 'sandbox'/'mock' = si accetta che le firme NON siano
      # qualificate (nessun valore legale finche' non c'e' un contratto QTSP).
      SIGNATURE_PROVIDER: ${SIGNATURE_PROVIDER:?SIGNATURE_PROVIDER richiesta (sandbox|qes)}
      TSA_PROVIDER: ${TSA_PROVIDER:?TSA_PROVIDER richiesta (mock|rfc3161)}
      # Autenticazione: Keycloak come IdP SAML (realm condiviso ignicraft).
      # La SpidStrategy (passport-saml) legge le variabili SPID_*.
      # Invio email. PRIMA di questo blocco nessuna SMTP_* arrivava al
      # container: le credenziali potevano stare in /opt/rifiuti/.env e il
      # backend non le vedeva comunque, quindi l'invio falliva all'avvio con
      # «Missing credentials for PLAIN» qualunque cosa ci fosse nel file.
      #
      # Porta 465 (SMTPS diretto) e NON 587: il provider del VPS blocca la 587
      # in uscita. Il codice attiva TLS solo se SMTP_PORT vale esattamente
      # '465', quindi la porta va lasciata cosi'.
      #
      # Con Gmail la password NON e' quella dell'account ma una App Password
      # (https://myaccount.google.com/apppasswords), e SMTP_USER deve essere
      # lo stesso indirizzo di EMAIL_FROM, altrimenti Gmail riscrive il
      # mittente e i messaggi finiscono nello spam.
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      # Destinatario delle notifiche di richiesta accesso: senza questa (e
      # senza EMAIL_FROM) la notifica viene saltata in silenzio.
      ACCESS_REQUEST_NOTIFY_EMAIL: ${ACCESS_REQUEST_NOTIFY_EMAIL}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-https://auth.ignicraft.com}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ignicraft}
      # Service account 'rifiuti-admin' (client_credentials) per il provisioning
      # utenti su Keycloak (KeycloakUserAdapter).
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-rifiuti-admin}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SPID_IDP_ENTRY_POINT: ${SPID_IDP_ENTRY_POINT:-https://auth.ignicraft.com/realms/ignicraft/protocol/saml}
      SPID_ENTITY_ID: ${SPID_ENTITY_ID:-rifiuti}
      SPID_CALLBACK_URL: ${SPID_CALLBACK_URL:-https://rifiuti.ignicraft.com/api/v1/auth/spid/callback}
      SPID_IDP_CERT: ${SPID_IDP_CERT}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID}
      # Error tracking (Bugsink, progetto wasteflow). Vuota = SDK spento.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Release su Bugsink e nella pagina "Stato del sistema": il tag dell'immagine.
      APP_VERSION: ${TAG:-latest}
      # Base dei link nelle mail di notifica (senza: https://wasteflow.app).
      PUBLIC_URL: ${PUBLIC_URL:-https://rifiuti.ignicraft.com}
      # Firma HMAC della cache permessi: senza, il codice usa 'change-me-in-production'.
      PERMISSION_CACHE_HMAC_SECRET: ${PERMISSION_CACHE_HMAC_SECRET:?PERMISSION_CACHE_HMAC_SECRET richiesta}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wasteflow
      - monitoring

  frontend:
    image: ${REGISTRY:-gitea.tail8be933.ts.net/graziano}/rifiuti-frontend:${TAG:-latest}
    restart: always
    logging: *logging
    depends_on:
      - backend
    networks:
      - wasteflow
    ports:
      # Solo loopback: l'nginx di sistema fa da reverse proxy + TLS
      - "127.0.0.1:3017:80"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  wasteflow:
    driver: bridge
  # Rete dell'osservabilita' condivisa (/opt/observability/), creata altrove.
  monitoring:
    external: true

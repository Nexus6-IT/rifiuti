            Il formato del contenuto del QR Code è conforme allo standard CBOR Object Signing and Encryption (COSE), RFC 8152.
          format: byte
          nullable: true
        check_sum:
          type: string
          description: Caratteri alfanumerici utilizzati come codice univoco associato in sede di vidimazione al numero FIR
          nullable: true
        data_richiesta:
          type: string
          description: Data e ora in cui è stata effettuata la richiesta di vidimazione del FIR (formato ISO 8601 UTC)
          format: date-time
        denominazione_soggetto:
          type: string
          description: Ragione sociale del soggetto per conto del quale è stato vidimato il FIR
          nullable: true
        codice_fiscale_soggetto:
          type: string
          description: Codice fiscale del soggetto per conto del quale è stato vidimato il FIR
          nullable: true
        num_iscr_sito:
          type: string
          description: Numero di iscrizione dell'unità locale del soggetto per conto del quale è stato vidimato il FIR
          nullable: true
        codice_blocco:
          type: string
          description: Codice del blocco a cui appartiene il FIR
          nullable: true
        cciaa_nome:
          type: string
          description: Nome della CCIAA di competenza del FIR
          nullable: true
        is_annullato:
          type: boolean
          description: Stato di annullamento del FIR
          nullable: true
        data_annullamento:
          type: string
          description: Data dell'eventuale annullamento del FIR (formato ISO 8601 UTC)
          format: date-time
          nullable: true
      additionalProperties: false
    EsitoMessaggioModel:
      type: object
      properties:
        indice:
          type: integer
          description: Indice dell'elemento di input relativo al messaggio di validazione
          format: int32
          nullable: true
        campo:
          type: string
          description: Campo dell'elemento di input relativo al messaggio di validazione
          nullable: true
        tipo:
          allOf:
          - $ref: '#/components/schemas/EsitoMessaggioTipo'
          description: Tipo del messaggio (avvertimento o errore)
        codice_messaggio:
          type: string
          description: Codice del messaggio
          nullable: true
        parametri:
          type: array
          items: {}

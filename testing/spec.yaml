    nota: "init: riferimento indicato con --collega (firs.receiver_id -> destinatari)"
    chiave: *a3
    sql: |
      SELECT c.id, c.receiver_id::text AS riferimento
        FROM firs c
       WHERE c.receiver_id IS NOT NULL
         AND c.tenant_id = ANY($tenant)
         AND NOT EXISTS (SELECT 1 FROM destinatari p WHERE p.id = c.receiver_id)
